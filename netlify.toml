# Déploiement Netlify : Netlify lit ce fichier, construit l'application et publie le dossier dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# En-têtes de sécurité (CSP, anti-cadre…) : générés au build dans dist/_headers,
# car la politique de contenu contient l'empreinte du script de la page (voir vite.config.js).

# L'application tient en une seule page : toute adresse inconnue renvoie vers elle.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
